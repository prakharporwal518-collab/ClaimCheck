# Render Blueprint: deploy ClaimCheck with one click (Dashboard > New > Blueprint).
services:
  # FastAPI API + built React app on one URL
  - type: web
    name: claimcheck
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # No DATABASE_URL here: Render allows one free Postgres per workspace, so by default the
      # app keeps its data in SQLite inside the container. The demo data reloads on every
      # start, so a restart simply resets the demo. To keep data, add DATABASE_URL in the
      # dashboard (Render Postgres, Supabase or Neon connection string).
      - key: PAYPAL_MODE
        # hybrid = seeded demo disputes + your real PayPal Sandbox disputes in one inbox.
        # Without PAYPAL_CLIENT_ID/SECRET it simply shows the demo data.
        value: hybrid
      - key: SANDBOX_ACTIONS_KEY  # optional: asked before Submit/Refund on real Sandbox disputes
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: USE_RENDER_WORKFLOWS
        value: "false"         # set "true" after creating the Workflow service below
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        value: claimcheck-workflows

# Render Workflows (beta) are created from the dashboard: New > Workflow,
# same repo, root directory "backend", build "pip install -r requirements.txt",
# start "python workflows/main.py", slug "claimcheck-workflows", and the same
# GEMINI_API_KEY. Workflows need a shared DATABASE_URL (Postgres), because the
# workers run on separate machines. See README "Render Workflows".
