# Render Blueprint: deploy ClaimCheck with one click (Dashboard > New > Blueprint).
services:
  # FastAPI API + built React app on one URL
  - type: web
    name: claimcheck
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Shared Postgres (we use Neon; Render allows one free Postgres per workspace).
      # Needed for Render Workflows, because the workers run on separate machines.
      # Without it the app falls back to SQLite inside the container (reset on restart).
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_MODE
        # hybrid = seeded demo disputes + your real PayPal Sandbox disputes in one inbox.
        # Without PAYPAL_CLIENT_ID/SECRET it simply shows the demo data.
        value: hybrid
      - key: SANDBOX_ACTIONS_KEY  # optional: asked before Submit/Refund on real Sandbox disputes
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: USE_RENDER_WORKFLOWS
        value: "true"          # only takes effect once RENDER_API_KEY is set
      - key: WORKFLOW_START_TIMEOUT
        value: "90"            # safety net: run in-process if no Workflow worker starts in time
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKFLOW_SLUG
        value: claimcheck-workflows

# Render Workflows (beta) are created from the dashboard: New > Workflow,
# same repo, root directory "backend", build "pip install -r requirements.txt",
# start "python workflows/main.py", name "claimcheck-workflows", and the same
# DATABASE_URL and GEMINI_API_KEY as the web service. See README "Render Workflows".
